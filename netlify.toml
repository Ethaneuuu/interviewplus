[build]
  command = "node scripts/build-static.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  included_files = ["assets/js/xlsx.full.min.js"]

[[redirects]]
  from = "/api/correct"
  to = "/.netlify/functions/correct"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
